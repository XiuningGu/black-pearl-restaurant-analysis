name: Validation checks

on:
  push:
  pull_request:

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate analysis outputs
        run: python src/analysis.py
      - name: Execute notebook
        run: >-
          jupyter nbconvert --to notebook --execute
          notebooks/black_pearl_analysis.ipynb
          --output /tmp/black_pearl_analysis.executed.ipynb
      - name: Run validation tests
        run: python -m unittest discover -s tests -v
      - name: Confirm deterministic generated files are committed
        run: >-
          git diff --exit-code --
          data/processed/black_pearl_clean.csv
          data/public/black_pearl_restaurants.csv
          notebooks/black_pearl_analysis.ipynb
